[project]
name = "bio-governance-lab"
version = "0.1.0"
description = "Governance-as-code foundations for synthetic life-sciences data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ron Finn" }]
keywords = ["data-governance", "life-sciences", "metadata", "data-contracts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "acryl-datahub>=1.7",
    "httpx>=0.28",
    "mcp>=2.1",
    "openlineage-python>=1.52",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
bio-gov = "bio_governance.cli:app"

[project.urls]
Homepage = "https://github.com/ronfinn/bio-governance-lab"
Repository = "https://github.com/ronfinn/bio-governance-lab"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bio_governance"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# DataHub's metadata model is code-generated from Avro schemas, and some of the
# generated constructors carry no annotations at all, so strict mode reads
# ``StringTypeClass()`` as an untyped call. The exemption is for calls into that
# one package; strictness is not relaxed anywhere else, and src carries no
# ``type: ignore`` for it.
untyped_calls_exclude = ["datahub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
